name: test-functional-microshift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONWARNINGS: ignore
  KUBECONFIG: ${{ github.workspace }}/kubeconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Fix for "grup-efi-amd64-signed" missing
        run: |
          sudo apt-mark hold grub-efi-amd64-signed

      - name: Upgrade and install packages
        run: |
          bash ./ci/setup-ubuntu.sh

      - name: Install oc/kubectl clients
        run: |
          bash ./ci/setup-oc-client.sh

      - name: Install Microshift
        run: |
          ./ci/microshift.sh

      - name: Install Allocation CRD
        run: |
          oc apply -f ./k8s/allocation-crd.yaml

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run functional tests
        run: |
          pytest -n auto./tests
